# Builds the Jupyter Book site on every pull request and deploys it to GitHub Pages on pushes to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Jupyter Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Project sites are served from https://<owner>.github.io/<repo>/
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@2.1.7
      # Plotly figures saved with a static PNG fallback render as that PNG on the site.
      # Drop the PNG (in this build checkout only) so the theme renders the interactive chart.
      - name: Prefer interactive Plotly charts
        run: |
          python3 - <<'EOF'
          import json
          import pathlib

          for path in pathlib.Path(".").glob("**/*.ipynb"):
              nb = json.loads(path.read_text(encoding="utf-8"))
              changed = False
              for cell in nb["cells"]:
                  for output in cell.get("outputs", []):
                      data = output.get("data", {})
                      if "application/vnd.plotly.v1+json" in data and "image/png" in data:
                          del data["image/png"]
                          changed = True
              if changed:
                  path.write_text(json.dumps(nb, indent=1, ensure_ascii=False), encoding="utf-8")
          EOF
      - name: Build HTML
        run: jupyter-book build --html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
