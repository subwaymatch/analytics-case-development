# Builds the Jupyter Book site on every pull request and deploys it to GitHub Pages on pushes to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Jupyter Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Project sites are served from https://<owner>.github.io/<repo>/
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@2.1.7
      - name: Build HTML
        run: jupyter-book build --html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
